<div class="om-starry-sky" [ngStyle]="style" [ngClass]="styleClass" #OmStarrySkyWrapper>
  <div class="om-starry-sky-background">
    <svg #OmStarrySkySvg>
      @if (shootingStar(); as star) {
        <rect [attr.key]="star.id" [attr.x]="star.x" [attr.y]="star.y"
              [attr.width]="(shootingStarsProps.starWidth ?? 1) * (star.scale)"
              [attr.height]="shootingStarsProps.starHeight ?? 10" [attr.fill]="'url(#gradient)'"
              [attr.transform]="'rotate(' + star.angle + ', ' + (star.x + (shootingStarsProps.starWidth ?? 1) * star.scale / 2) + ', ' + (star.y + (shootingStarsProps.starHeight ?? 10) / 2) + ')'">
        </rect>
        <defs>
          <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" [style.stopColor]="shootingStarsProps.trailColor" [style.stopOpacity]="'0'"/>
            <stop offset="100%" [style.stopColor]="shootingStarsProps.starColor" [style.stopOpacity]="'1'"/>
          </linearGradient>
        </defs>
      }
    </svg>
    <canvas #OmStarrySkyCanvas></canvas>
  </div>

  <ng-content></ng-content>
</div>
